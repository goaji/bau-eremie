<svg viewBox="0 0 640 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technische Skizze eines Hausquerschnitts mit Bemassung, Gruendungstiefe, Planstempel und Verweisen auf die drei Leistungsbereiche">
  <defs>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#242420" stroke-width="1"/>
    </pattern>
    <pattern id="soilHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#3A3934" stroke-width="3"/>
    </pattern>
  </defs>

  <style>
    .bp-line { stroke: #5C5A53; stroke-width: 1.4; fill: none; }
    .bp-red { stroke: #C1392B; stroke-width: 1.3; fill: none; }
    .bp-red-fill { fill: #C1392B; }
    .bp-text { font-family: 'IBM Plex Mono', monospace; fill: #E7E3DA; font-size: 11px; }
    .bp-text-red { font-family: 'IBM Plex Mono', monospace; fill: #C1392B; font-size: 11.5px; font-weight: 500; }
    .bp-dash { stroke: #514F49; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }

    /* draw-on: element carries pathLength="1" so one unit == its full length */
    @keyframes bpDraw { to { stroke-dashoffset: 0; } }
    @keyframes bpFade { to { opacity: 1; } }
    .d {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: bpDraw var(--dur, .7s) cubic-bezier(.45,.05,.35,1) forwards;
      animation-delay: var(--at, 0s);
    }
    .f {
      opacity: 0;
      animation: bpFade var(--dur, .45s) ease-out forwards;
      animation-delay: var(--at, 0s);
    }
    @media (prefers-reduced-motion: reduce) {
      .d { stroke-dashoffset: 0; animation: none; }
      .f { opacity: 1; animation: none; }
    }
  </style>

  <!-- remove this rect if the page already has a dark background -->
  <rect x="0" y="0" width="640" height="660" fill="#161A18"/>

  <!-- ===== static base layer: visible immediately, never animates ===== -->
  <rect x="0" y="0" width="640" height="660" fill="url(#gridPattern)"/>
  <path class="bp-line" d="M140 460V300L300 180L460 300V460"/>
  <path class="bp-line" d="M120 460H480"/>

  <!-- ===== animated layer ===== -->

  <!-- north arrow -->
  <path class="bp-line d" style="--at:.2s;--dur:.5s" pathLength="1" d="M50 62V28"/>
  <path class="f" style="--at:.65s" d="M50 20L44 34H56Z" fill="#5C5A53"/>
  <text class="bp-text f" style="--at:.8s" x="50" y="80" text-anchor="middle">N</text>

  <!-- door + windows -->
  <path class="bp-line d" style="--at:.5s;--dur:.5s" pathLength="1" d="M282 380h36v80h-36z"/>
  <path class="bp-line d" style="--at:.8s;--dur:.5s" pathLength="1" d="M180 340h46v46h-46z"/>
  <path class="bp-line d" style="--at:1.2s;--dur:.3s" pathLength="1" d="M203 340v46"/>
  <path class="bp-line d" style="--at:1.3s;--dur:.3s" pathLength="1" d="M180 363h46"/>
  <path class="bp-line d" style="--at:1s;--dur:.5s" pathLength="1" d="M414 340h46v46h-46z"/>
  <path class="bp-line d" style="--at:1.4s;--dur:.3s" pathLength="1" d="M437 340v46"/>
  <path class="bp-line d" style="--at:1.5s;--dur:.3s" pathLength="1" d="M414 363h46"/>

  <!-- foundation / ground -->
  <rect class="f" style="--at:1.7s;--dur:.6s" x="120" y="460" width="360" height="34" fill="url(#soilHatch)"/>
  <path class="bp-dash f" style="--at:2s" d="M120 494H480"/>
  <path class="bp-red d" style="--at:2.2s;--dur:.4s" pathLength="1" d="M100 460V494"/>
  <path class="bp-red d" style="--at:2.45s;--dur:.25s" pathLength="1" d="M92 460h16"/>
  <path class="bp-red d" style="--at:2.55s;--dur:.25s" pathLength="1" d="M92 494h16"/>
  <text class="bp-text-red f" style="--at:2.8s" x="78" y="481" text-anchor="end">0,80 m</text>
  <text class="bp-text f" style="--at:2.9s" x="78" y="495" text-anchor="end">Gründung</text>

  <!-- top dimension -->
  <path class="bp-dash f" style="--at:3s" d="M140 300V110"/>
  <path class="bp-dash f" style="--at:3.1s" d="M460 300V110"/>
  <path class="bp-red d" style="--at:3.2s;--dur:.7s" pathLength="1" d="M140 110H460"/>
  <path class="bp-red d" style="--at:3.8s;--dur:.25s" pathLength="1" d="M140 102v16"/>
  <path class="bp-red d" style="--at:3.9s;--dur:.25s" pathLength="1" d="M460 102v16"/>
  <text class="bp-text-red f" style="--at:4.1s" x="270" y="98" text-anchor="middle">9,60 m</text>

  <!-- side dimension -->
  <path class="bp-dash f" style="--at:3.4s" d="M460 300H520"/>
  <path class="bp-dash f" style="--at:3.5s" d="M460 460H520"/>
  <path class="bp-red d" style="--at:3.6s;--dur:.7s" pathLength="1" d="M520 180V460"/>
  <path class="bp-red d" style="--at:4.2s;--dur:.25s" pathLength="1" d="M512 180h16"/>
  <path class="bp-red d" style="--at:4.3s;--dur:.25s" pathLength="1" d="M512 460h16"/>
  <text class="bp-text-red f" style="--at:4.5s" x="536" y="324" transform="rotate(90 536 324)">6,40 m</text>

  <!-- wall detail callout -->
  <path class="bp-red d" style="--at:4.6s;--dur:.6s" pathLength="1" d="M140 347a13 13 0 1 1-.01 0"/>
  <path class="bp-dash f" style="--at:5.1s" d="M127 352L60 230"/>
  <path class="bp-line d" style="--at:5.2s;--dur:.6s" pathLength="1" d="M30 150h90v70h-90z"/>
  <rect class="f" style="--at:5.6s" x="34" y="154" width="14" height="62" fill="#3A3934"/>
  <rect class="f" style="--at:5.7s" x="48" y="154" width="34" height="62" fill="#514F49"/>
  <rect class="f" style="--at:5.8s" x="82" y="154" width="10" height="62" fill="#3A3934"/>
  <text class="bp-text f" style="--at:6s" x="30" y="238">Wandaufbau</text>
  <text class="bp-text-red f" style="--at:6.1s" x="30" y="252">U = 0,18 W/m²K</text>

  <!-- leader lines to services -->
  <path class="bp-dash f" style="--at:6.3s;--dur:.5s" d="M300 180L560 150"/>
  <circle class="bp-red-fill f" style="--at:6.5s" cx="300" cy="180" r="3.5"/>
  <text class="bp-text-red f" style="--at:6.6s" x="565" y="146">Planung &amp; Statik</text>

  <path class="bp-dash f" style="--at:6.8s;--dur:.5s" d="M460 430L560 330"/>
  <circle class="bp-red-fill f" style="--at:7s" cx="460" cy="430" r="3.5"/>
  <text class="bp-text-red f" style="--at:7.1s" x="565" y="326">Rohbau &amp; Ausbau</text>

  <path class="bp-dash f" style="--at:7.3s;--dur:.5s" d="M153 360L560 470"/>
  <text class="bp-text-red f" style="--at:7.6s" x="565" y="466">Energieberatung</text>
  <text class="bp-text-red f" style="--at:7.7s" x="565" y="482">(GEG)</text>

  <!-- title block / plan stamp -->
  <path class="bp-line d" style="--at:7.9s;--dur:.8s" pathLength="1" d="M340 560h260v76h-260z"/>
  <path class="bp-red d" style="--at:8.5s;--dur:.4s" pathLength="1" d="M340 560H600"/>
  <path class="bp-line d" style="--at:8.6s;--dur:.35s" pathLength="1" d="M340 584H600"/>
  <path class="bp-line d" style="--at:8.7s;--dur:.35s" pathLength="1" d="M340 608H600"/>
  <path class="bp-line d" style="--at:8.8s;--dur:.35s" pathLength="1" d="M460 584v52"/>
  <text class="bp-text f" style="--at:9s" x="350" y="576">OBJEKT · EFH GARCHING A.D.ALZ</text>
  <text class="bp-text f" style="--at:9.1s" x="350" y="600">MASSSTAB 1:100</text>
  <text class="bp-text f" style="--at:9.15s" x="470" y="600">PLANSKIZZE</text>
  <text class="bp-text f" style="--at:9.2s" x="350" y="624">GEZ. A. EREMIE</text>
  <text class="bp-text f" style="--at:9.25s" x="470" y="624">STAND 07/2026</text>
</svg>
