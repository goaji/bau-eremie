<svg viewBox="0 0 640 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technische Skizze eines Hausquerschnitts mit Bemaßung, Gründungstiefe, Planstempel und Verweisen auf die drei Leistungsbereiche">
  <defs>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#242420" stroke-width="1"/>
    </pattern>
    <pattern id="soilHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#3A3934" stroke-width="3"/>
    </pattern>
  </defs>

  <style>
    .bp-line { stroke: #5C5A53; stroke-width: 1.4; fill: none; }
    .bp-red { stroke: #C1392B; stroke-width: 1.3; fill: none; }
    .bp-red-fill { fill: #C1392B; }
    .bp-text { font-family: 'IBM Plex Mono', monospace; fill: #E7E3DA; font-size: 11px; }
    .bp-text-red { font-family: 'IBM Plex Mono', monospace; fill: #C1392B; font-size: 11.5px; font-weight: 500; }
    .bp-dash { stroke: #514F49; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  </style>

  <rect x="0" y="0" width="640" height="660" fill="url(#gridPattern)" />

  <!-- north arrow -->
  <line class="bp-line" x1="50" y1="62" x2="50" y2="28" />
  <polygon points="50,20 44,34 56,34" fill="#5C5A53" />
  <text class="bp-text" x="50" y="80" text-anchor="middle">N</text>

  <!-- house outline -->
  <polyline class="bp-line" points="140,460 140,300 300,180 460,300 460,460" />
  <line class="bp-line" x1="120" y1="460" x2="480" y2="460" />
  <rect class="bp-line" x="282" y="380" width="36" height="80" />
  <rect class="bp-line" x="180" y="340" width="46" height="46" />
  <rect class="bp-line" x="414" y="340" width="46" height="46" />
  <line class="bp-line" x1="203" y1="340" x2="203" y2="386" />
  <line class="bp-line" x1="180" y1="363" x2="226" y2="363" />
  <line class="bp-line" x1="437" y1="340" x2="437" y2="386" />
  <line class="bp-line" x1="414" y1="363" x2="460" y2="363" />

  <!-- foundation / ground -->
  <rect x="120" y="460" width="360" height="34" fill="url(#soilHatch)" />
  <line class="bp-dash" x1="120" y1="494" x2="480" y2="494" />
  <line class="bp-red" x1="100" y1="460" x2="100" y2="494" />
  <line class="bp-red" x1="92" y1="460" x2="108" y2="460" />
  <line class="bp-red" x1="92" y1="494" x2="108" y2="494" />
  <text class="bp-text-red" x="78" y="481" text-anchor="end">0,80 m</text>
  <text class="bp-text" x="78" y="495" text-anchor="end">Gründung</text>

  <!-- top dimension -->
  <line class="bp-red" x1="140" y1="110" x2="460" y2="110" />
  <line class="bp-red" x1="140" y1="102" x2="140" y2="118" />
  <line class="bp-red" x1="460" y1="102" x2="460" y2="118" />
  <line class="bp-dash" x1="140" y1="300" x2="140" y2="110" />
  <line class="bp-dash" x1="460" y1="300" x2="460" y2="110" />
  <text class="bp-text-red" x="270" y="98" text-anchor="middle">9,60 m</text>

  <!-- side dimension -->
  <line class="bp-red" x1="520" y1="180" x2="520" y2="460" />
  <line class="bp-red" x1="512" y1="180" x2="528" y2="180" />
  <line class="bp-red" x1="512" y1="460" x2="528" y2="460" />
  <line class="bp-dash" x1="460" y1="300" x2="520" y2="300" />
  <line class="bp-dash" x1="460" y1="460" x2="520" y2="460" />
  <text class="bp-text-red" x="536" y="324" transform="rotate(90 536 324)">6,40 m</text>

  <!-- wall detail callout -->
  <circle class="bp-red" cx="140" cy="360" r="13" />
  <line class="bp-dash" x1="127" y1="352" x2="60" y2="230" />
  <rect class="bp-line" x="30" y="150" width="90" height="70" />
  <rect x="34" y="154" width="14" height="62" fill="#3A3934" />
  <rect x="48" y="154" width="34" height="62" fill="#514F49" />
  <rect x="82" y="154" width="10" height="62" fill="#3A3934" />
  <text class="bp-text" x="30" y="238">Wandaufbau</text>
  <text class="bp-text-red" x="30" y="252">U = 0,18 W/m²K</text>

  <!-- leader lines to services -->
  <line class="bp-dash" x1="300" y1="180" x2="560" y2="150" />
  <circle class="bp-red-fill" cx="300" cy="180" r="3.5" />
  <text class="bp-text-red" x="565" y="146">Planung &amp; Statik</text>

  <line class="bp-dash" x1="460" y1="430" x2="560" y2="330" />
  <circle class="bp-red-fill" cx="460" cy="430" r="3.5" />
  <text class="bp-text-red" x="565" y="326">Rohbau &amp; Ausbau</text>

  <line class="bp-dash" x1="153" y1="360" x2="560" y2="470" />
  <text class="bp-text-red" x="565" y="466">Energieberatung</text>
  <text class="bp-text-red" x="565" y="482">(GEG)</text>

  <!-- title block / plan stamp -->
  <g>
    <rect class="bp-line" x="340" y="560" width="260" height="76" />
    <line class="bp-red" x1="340" y1="560" x2="600" y2="560" />
    <line class="bp-line" x1="340" y1="584" x2="600" y2="584" />
    <line class="bp-line" x1="340" y1="608" x2="600" y2="608" />
    <line class="bp-line" x1="460" y1="584" x2="460" y2="636" />
    <text class="bp-text" x="350" y="576">OBJEKT · EFH GARCHING A.D.ALZ</text>
    <text class="bp-text" x="350" y="600">MASSSTAB 1:100</text>
    <text class="bp-text" x="470" y="600">PLANSKIZZE</text>
    <text class="bp-text" x="350" y="624">GEZ. A. EREMIE</text>
    <text class="bp-text" x="470" y="624">STAND 07/2026</text>
  </g>
</svg>
